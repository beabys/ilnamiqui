version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ilnamiqui-cli
    main: ./cmd/cli
    binary: ilnamiqui
    ldflags:
      - -X github.com/beabys/ilnamiqui/internal/cli.version={{.Version}}
      - -X github.com/beabys/ilnamiqui/internal/cli.commit={{.Commit}}
      - -X github.com/beabys/ilnamiqui/internal/cli.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: ilnamiqui-mcp
    main: ./cmd/mcp
    binary: ilnamiqui-mcp
    ldflags:
      - -X github.com/beabys/ilnamiqui/internal/cli.version={{.Version}}
      - -X github.com/beabys/ilnamiqui/internal/cli.commit={{.Commit}}
      - -X github.com/beabys/ilnamiqui/internal/cli.date={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - name_template: "{{.ProjectName}}-{{.Os}}-{{.Arch}}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  github:
    owner: beabys
    name: ilnamiqui

checksum:
  name_template: "checksums.txt"

# snapshot uses default version template ({{.Tag}}-SNAPSHOT-{{.ShortCommit}})
