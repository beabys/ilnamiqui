name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Unit tests
        run: go test ./... -count=1
      - name: Integration tests
        run: go test -tags=integration -count=1 ./...
      - name: Lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.0 && golangci-lint run ./...
      - name: Coverage
        run: make coverage
      - name: Build
        run: go build ./cmd/cli/ && go build ./cmd/mcp/
